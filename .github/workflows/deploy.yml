name: Deploy

on:
  push:
    branches: [main, platform, design-lab]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout platform into subfolder
        uses: actions/checkout@v4
        with:
          ref: platform
          path: site/platform

      - name: Remove stale lab artifact
        run: rm -rf site/lab

      - name: Checkout design-lab into subfolder (experimental UI, isolated from platform)
        uses: actions/checkout@v4
        with:
          ref: 0088f1d5c4ae9ca84c9c6b3e5e63f958d837a477
          path: site/lab

      - name: Clean git folders
        run: |
          rm -rf site/.git
          rm -rf site/platform/.git
          rm -rf site/lab/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
